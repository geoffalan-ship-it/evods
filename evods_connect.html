<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connect with EVODS</title>
  <style>
    :root{--green:#4BA114;--canvas:#171717;--panel:#222;--field:#303030;--line:rgba(255,255,255,.12);--label:#b9b9bb;--white:#f6f6f6}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--white);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.nav{height:72px;background:#0b0b0b;padding:0 6vw;display:flex;align-items:center}.nav img{width:126px;filter:brightness(0) invert(1)}main{width:min(100%,1180px);margin:auto;padding:132px 40px 100px}h1{font-size:clamp(2.8rem,5vw,5.4rem);letter-spacing:-.06em;line-height:.95;font-weight:750;margin:0 0 18px}.form-intro{max-width:690px;color:rgba(255,255,255,.7);font-size:18px;line-height:1.65;margin:0 0 42px}.form{background:var(--panel);padding:clamp(28px,4vw,48px);border-radius:16px;box-shadow:0 22px 55px rgba(0,0,0,.28);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.field{display:flex;flex-direction:column;gap:9px}.field.full{grid-column:1/-1}label{font-size:11px;font-weight:750;letter-spacing:.14em;text-transform:uppercase;color:var(--label)}input,textarea{width:100%;border:1px solid rgba(255,255,255,.12);border-radius:9px;background:var(--field);color:var(--white);padding:0 18px;font:500 16px/1.4 inherit;outline:none;transition:border-color .2s,background .2s}input{height:56px}textarea{min-height:160px;border-radius:9px;padding:16px 18px;line-height:1.55;resize:vertical}input::placeholder,textarea::placeholder{color:#8d8d90}input:focus,textarea:focus{border-color:var(--green);background:#353535}.submit{position:static;width:auto;min-width:210px;height:54px;margin-top:26px;padding:0 24px;border:0;border-radius:8px;background:var(--green);color:#fff;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.submit span{font-size:0}.submit span:after{content:'Connect with EVODS →';font-size:12px}.success{max-width:900px;padding:28px;border-radius:12px;background:#20301a;border:1px solid #4BA114;color:#fff;font-size:18px}@media(max-width:760px){main{padding:108px 22px 70px}h1{font-size:clamp(2.55rem,12vw,3.6rem)}.form-intro{font-size:16px;margin-bottom:30px}.form{padding:24px}.grid{grid-template-columns:1fr;gap:20px}.field.full{grid-column:auto}input{height:54px}textarea{min-height:150px}.submit{width:100%;margin-top:22px}}</style>
  <link rel="stylesheet" href="/alternate-site.css?v=7">
</head>
<body>
  <nav class="nav"><a href="index.html"><img src="/assets/logo.svg" alt="EVODS"></a></nav>
  <main>
    <h1>Connect with EVODS.</h1>
    <p class="form-intro">Tell us about your fleet, property, charging needs, or partnership opportunity. Our team will follow up to discuss the right EVODS solution.</p>
    <form class="form">
      <div class="grid">
        <div class="field"><label for="name">Name *</label><input id="name" name="name" placeholder="Your name" required></div>
        <div class="field"><label for="email">Email *</label><input id="email" name="email" type="email" placeholder="you@example.com" required></div>
        <div class="field full"><label for="phone">Phone number</label><input id="phone" name="phone" type="tel" placeholder="206-555-0100"></div>
        <div class="field full"><label for="message">Message</label><textarea id="message" name="message" placeholder="Tell us what you want to discuss."></textarea></div>
      </div>
      <button class="submit" type="submit" aria-label="Connect with EVODS" title="Connect with EVODS"><span>→</span></button>
    </form>
    <div class="success" hidden>Thank you. Your message has been received. Our team will be in touch.</div>
  </main>
  <script>document.querySelector('form').addEventListener('submit',function(event){event.preventDefault();this.hidden=true;document.querySelector('.success').hidden=false;});</script>
  <script src="/site-nav.js?v=10"></script>
</body>
</html>
