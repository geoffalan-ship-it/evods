<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EVODS Expansion Map</title>
  <link rel="stylesheet" href="/alternate-site.css?v=7">
</head>
<body>
<main>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-sans,sans-serif)}
  .wrap{background:#111;border-radius:12px;overflow:hidden}
  .map-header{padding:20px 24px 0;display:flex;align-items:flex-start;justify-content:space-between}
  .map-label{font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:#4BA114;margin-bottom:6px}
  .map-title{font-size:20px;font-weight:500;color:#fff}
  .legend{display:flex;gap:16px;align-items:center;padding-top:6px}
  .leg{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(255,255,255,0.6)}
  .leg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .dot-live{background:#4BA114}
  .dot-soon{background:#EF9F27}
  #map-svg{display:block;width:100%}
  .tooltip{position:absolute;background:#1a1a1a;border:1px solid rgba(255,255,255,0.12);border-radius:8px;padding:10px 14px;pointer-events:none;opacity:0;transition:opacity 0.15s;z-index:10}
  .tt-code{font-size:11px;font-weight:500;color:#4BA114;letter-spacing:0.1em;margin-bottom:2px}
  .tt-name{font-size:13px;color:#fff;font-weight:500;margin-bottom:2px}
  .tt-status{font-size:11px}
  .tt-live{color:#4BA114}
  .tt-soon{color:#EF9F27}
  .location-list{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;border-top:1px solid rgba(255,255,255,0.08);margin-top:4px}
  .loc-item{padding:10px 16px;border-right:1px solid rgba(255,255,255,0.06);border-bottom:1px solid rgba(255,255,255,0.06);cursor:pointer;transition:background 0.12s}
  .loc-item:hover{background:rgba(255,255,255,0.04)}
  .loc-item.active{background:rgba(75,161,20,0.1)}
  .loc-code{font-size:12px;font-weight:500;color:#4BA114;margin-bottom:1px}
  .loc-name{font-size:11px;color:rgba(255,255,255,0.5)}
  .loc-badge{font-size:10px;margin-top:3px;display:inline-block;padding:1px 6px;border-radius:10px}
  .badge-live{background:rgba(75,161,20,0.2);color:#4BA114}
  .badge-soon{background:rgba(239,159,39,0.2);color:#EF9F27}
  .map-container{position:relative;padding:0 16px 8px}
</style>
<style>
/* Typography sync with evods.com */
body{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif !important;font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.nav-item>a{font-size:13px !important;font-weight:500 !important;line-height:1.2 !important}
.dropdown-item{font-size:13px !important;line-height:1.35 !important}
.di-label{font-weight:600 !important}
.di-sub{font-size:11px !important;line-height:1.35 !important}
.hero-tag,.section-label,.valet-tag,.cost-tag,.promo-label,.exp-label,.map-label,.footer-col h5,.exp-field label{font-size:11px !important;font-weight:600 !important;letter-spacing:.14em !important;text-transform:uppercase !important}
.hero h1{font-size:clamp(3.2rem,9vw,7.25rem) !important;line-height:.86 !important;font-weight:900 !important;letter-spacing:-.04em !important;text-transform:uppercase !important;max-width:820px !important}
.hero-sub{font-size:clamp(18px,2vw,20px) !important;line-height:1.65 !important;font-weight:400 !important;max-width:680px !important}
.hero p[style*="font-size:20px"]{font-size:22px !important;line-height:1.45 !important;font-weight:400 !important}
.section-title,.valet-headline,.cost-headline,.promo-headline,.exp-title{font-size:clamp(2.2rem,7vw,5.2rem) !important;line-height:.9 !important;font-weight:900 !important;letter-spacing:-.03em !important;text-transform:uppercase !important}
.section-sub,.valet-body,.cost-body,.promo-body,.exp-sub{font-size:clamp(16px,1.8vw,18px) !important;line-height:1.7 !important;font-weight:400 !important}
.booking-strip h3{font-size:13px !important;font-weight:700 !important;letter-spacing:.12em !important;text-transform:uppercase !important}
.bfield label{font-size:11px !important;font-weight:600 !important}
.bfield select,.bfield input{font-size:14px !important;line-height:1.3 !important}
.book-btn,.btn-primary,.btn-outline,.mid-cta-btn,.valet-cta-btn,.cost-cta-btn,.promo-cta-btn,.notify-submit,.sc-cta,.exp-cta{font-size:12px !important;font-weight:800 !important;letter-spacing:.12em !important;text-transform:uppercase !important}
.sc-title{font-size:30px !important;line-height:1 !important;font-weight:900 !important;letter-spacing:-.02em !important;text-transform:uppercase !important}
.sc-status{font-size:12px !important;font-weight:700 !important;line-height:1.25 !important}
.sc-desc{font-size:15px !important;line-height:1.7 !important;font-weight:400 !important}
.sc-features li{font-size:14px !important;line-height:1.45 !important}
.fc-title,.how-title,.cf-title,.vi-text strong,.pi-text strong{font-size:18px !important;line-height:1.2 !important;font-weight:900 !important;text-transform:uppercase !important}
.fc-desc,.how-desc,.vi-text,.pi-text,.cr-label,.ar-name{font-size:14px !important;line-height:1.65 !important}
.map-title{font-size:clamp(28px,4vw,44px) !important;line-height:.95 !important;font-weight:900 !important;letter-spacing:-.03em !important;text-transform:uppercase !important}
.leg,.chip{font-size:13px !important}
.chip-city{font-size:12px !important}
.exp-selected-code{font-size:38px !important;line-height:1 !important;font-weight:900 !important;letter-spacing:-.03em !important;text-transform:uppercase !important}
.exp-selected-city{font-size:15px !important;line-height:1.45 !important}
.footer-brand p,.footer-col a,.footer-bottom p{font-size:14px !important;line-height:1.65 !important}
@media(max-width:760px){.hero h1{font-size:clamp(2.8rem,16vw,4.5rem) !important}.section-title,.valet-headline,.cost-headline,.promo-headline,.exp-title{font-size:clamp(2rem,12vw,3.5rem) !important}.sc-title{font-size:24px !important}.map-title{font-size:28px !important}}
</style>

<h2 class="sr-only">Interactive map of EVODS airport locations — 1 live at SEA-TAC, 10 coming soon across the US</h2>

<div class="wrap">
  <div class="map-header">
    <div>
      <div class="map-label">National expansion</div>
      <div class="map-title">EVODS is coming to an airport near you</div>
    </div>
    <div class="legend" style="padding-top:4px">
      <div class="leg"><span class="leg-dot dot-live"></span>Live now</div>
      <div class="leg"><span class="leg-dot dot-soon"></span>Coming soon</div>
    </div>
  </div>

  <div class="map-container">
    <div id="tooltip" class="tooltip"></div>
    <svg id="map-svg" viewBox="0 0 900 540" aria-label="US map showing EVODS airport locations" role="img"></svg>
  </div>

  <div class="location-list" id="loc-list"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
const airports = [
  {code:'SEA',name:'Seattle-Tacoma',city:'Seattle, WA',lat:47.449,lng:-122.309,live:true},
  {code:'PDX',name:'Portland Intl',city:'Portland, OR',lat:45.589,lng:-122.593,live:false},
  {code:'SJC',name:'San Jose Mineta',city:'San Jose, CA',lat:37.362,lng:-121.929,live:false},
  {code:'SFO',name:'San Francisco Intl',city:'San Francisco, CA',lat:37.619,lng:-122.374,live:false},
  {code:'SAN',name:'San Diego Intl',city:'San Diego, CA',lat:32.734,lng:-117.190,live:false},
  {code:'OAK',name:'Oakland Intl',city:'Oakland, CA',lat:37.721,lng:-122.221,live:false},
  {code:'AUS',name:'Austin-Bergstrom',city:'Austin, TX',lat:30.198,lng:-97.669,live:false},
  {code:'DEN',name:'Denver Intl',city:'Denver, CO',lat:39.856,lng:-104.674,live:false},
  {code:'BOS',name:'Logan Intl',city:'Boston, MA',lat:42.366,lng:-71.010,live:false},
  {code:'LAX',name:'Los Angeles Intl',city:'Los Angeles, CA',lat:33.943,lng:-118.408,live:false},
  {code:'PHX',name:'Phoenix Sky Harbor',city:'Phoenix, AZ',lat:33.438,lng:-112.008,live:false},
];

const svg = d3.select('#map-svg');
const proj = d3.geoAlbersUsa().scale(1050).translate([450,270]);
const path = d3.geoPath(proj);
const tooltip = document.getElementById('tooltip');
let activeCode = 'SEA';

d3.json('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json').then(us => {
  svg.selectAll('path')
    .data(topojson.feature(us, us.objects.states).features)
    .join('path')
    .attr('d', path)
    .attr('fill','rgba(255,255,255,0.04)')
    .attr('stroke','rgba(255,255,255,0.1)')
    .attr('stroke-width','0.5');

  airports.forEach(a => {
    const xy = proj([a.lng, a.lat]);
    if (!xy) return;
    const g = svg.append('g').attr('transform',`translate(${xy[0]},${xy[1]})`).style('cursor','pointer');

    if (a.live) {
      g.append('circle').attr('r',10).attr('fill','rgba(75,161,20,0.15)').attr('class','pulse-ring');
      g.append('circle').attr('r',6).attr('fill','#4BA114');
    } else {
      g.append('circle').attr('r',6).attr('fill','#EF9F27').attr('opacity','0.85');
    }

    g.append('text')
      .attr('y',-11)
      .attr('text-anchor','middle')
      .attr('font-size','10')
      .attr('font-weight','500')
      .attr('fill', a.live ? '#4BA114' : '#EF9F27')
      .attr('letter-spacing','0.05em')
      .text(a.code);

    g.on('mouseover', function(event) {
      tooltip.style.opacity = '1';
      tooltip.innerHTML = `<div class="tt-code">${a.code}</div><div class="tt-name">${a.name}</div><div class="tt-status ${a.live?'tt-live':'tt-soon'}">${a.live ? '● Live now' : '◌ Coming soon'}</div><div style="font-size:11px;color:rgba(255,255,255,0.4);margin-top:2px">${a.city}</div>`;
      setActive(a.code);
    }).on('mousemove', function(event) {
      const rect = document.getElementById('map-svg').closest('.map-container').getBoundingClientRect();
      const svgRect = document.getElementById('map-svg').getBoundingClientRect();
      const scaleX = svgRect.width / 900;
      const scaleY = svgRect.height / 540;
      const tx = xy[0]*scaleX + (svgRect.left - rect.left);
      const ty = xy[1]*scaleY + (svgRect.top - rect.top);
      tooltip.style.left = (tx + 12) + 'px';
      tooltip.style.top = (ty - 40) + 'px';
    }).on('mouseleave', function() {
      tooltip.style.opacity = '0';
    });
  });

  buildList();
});

function setActive(code) {
  activeCode = code;
  document.querySelectorAll('.loc-item').forEach(el => {
    el.classList.toggle('active', el.dataset.code === code);
  });
}

function buildList() {
  const list = document.getElementById('loc-list');
  airports.forEach(a => {
    const div = document.createElement('div');
    div.className = 'loc-item' + (a.code === activeCode ? ' active' : '');
    div.dataset.code = a.code;
    div.innerHTML = `<div class="loc-code">${a.code}</div><div class="loc-name">${a.city}</div><span class="loc-badge ${a.live?'badge-live':'badge-soon'}">${a.live?'Live':'Coming soon'}</span>`;
    div.addEventListener('mouseenter', () => setActive(a.code));
    list.appendChild(div);
  });
}
</script>
</main>
<script src="/site-nav.js?v=8"></script></body>
</html>
